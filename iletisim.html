<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İletişim — Teklifio</title>
<meta name="description" content="Teklifio'ya soru, öneri veya geri bildirim gönderin.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F6F2; --surface: #FFFFFF; --surface-2: #EFEDE6; --border: #DAD4C6;
    --text: #26251F; --text-muted: #6A6458;
    --accent: #4E5C4F; --accent-strong: #3A453B; --on-accent: #FFFFFF;
    --danger: #A6402F;
    --font: 'Manrope', system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1A1917; --surface: #211F1C; --surface-2: #2A2822; --border: #3A3730;
      --text: #EEEBE3; --text-muted: #A29C8E;
      --accent: #93A78F; --accent-strong: #B4C4AE; --on-accent: #1A1917;
      --danger: #D98A7B;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.65; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 1.5rem; }
  header { border-bottom: 1px solid var(--border); padding: 1.1rem 0; background: var(--surface); }
  .logo { font-weight: 800; font-size: 1.35rem; letter-spacing: -0.025em; text-decoration: none; color: var(--text); }
  .logo-accent { color: var(--accent); }
  main { padding: 2.5rem 0 3rem; }
  h1 { font-size: 1.6rem; font-weight: 800; margin: 0 0 0.5rem; }
  .lead { color: var(--text-muted); font-size: 0.95rem; margin: 0 0 1.75rem; }
  .field { margin-bottom: 1rem; }
  label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.35rem; }
  .optional-tag { font-weight: 400; opacity: 0.8; }
  input[type="text"], input[type="email"], textarea {
    width: 100%; font-family: var(--font); font-size: 0.95rem; color: var(--text);
    background: var(--surface-2); border: 1.5px solid var(--border); border-radius: 8px;
    padding: 0.6rem 0.7rem;
  }
  textarea { min-height: 9rem; resize: vertical; }
  input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .btn-primary {
    display: block; width: 100%; font-family: var(--font); font-size: 0.98rem; font-weight: 700;
    color: var(--on-accent); background: var(--accent-strong); border: none; border-radius: 8px;
    padding: 0.85rem 1rem; cursor: pointer;
  }
  .btn-primary:hover { background: var(--accent); }
  .btn-primary:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
  .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
  .status { min-height: 1.4em; margin: 0.9rem 0 0; font-size: 0.88rem; }
  .status.ok { color: var(--accent-strong); font-weight: 600; }
  .status.error { color: var(--danger); font-weight: 600; }
  .note { font-size: 0.8rem; color: var(--text-muted); margin-top: 1.5rem; }
  .note a { color: var(--text-muted); }
  footer { border-top: 1px solid var(--border); padding: 1.5rem 0; }
  footer a { font-size: 0.85rem; color: var(--text-muted); text-decoration: none; }
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="index.html">Teklif<span class="logo-accent">io</span></a></div></header>
<main class="wrap">
  <h1>İletişim</h1>
  <p class="lead">Soru, öneri veya geri bildiriminizi bize iletebilirsiniz.</p>

  <form id="contactForm" novalidate>
    <div class="field">
      <label for="name">Adınız <span class="optional-tag">(isteğe bağlı)</span></label>
      <input id="name" type="text" autocomplete="name">
    </div>
    <div class="field">
      <label for="email">E-posta <span class="optional-tag">(isteğe bağlı, yanıt istiyorsanız)</span></label>
      <input id="email" type="email" autocomplete="email">
    </div>
    <div class="field">
      <label for="message">Mesajınız</label>
      <textarea id="message" required></textarea>
    </div>
    <input type="checkbox" id="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit" class="btn-primary" id="sendBtn">Gönder</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>

  <p class="note">Mesajınız ve (yazdıysanız) e-posta adresiniz yalnızca size yanıt verebilmemiz için kullanılır. Ayrıntılar için <a href="gizlilik-politikasi.html">Gizlilik Politikası</a>.</p>
</main>
<footer class="wrap"><a href="index.html">← Ana sayfaya dön</a></footer>

<script>
(function () {
  "use strict";
  // Web3Forms'tan aldığınız Access Key'i buraya yapıştırın
  var ACCESS_KEY = 'bacea2de-3908-4a3a-9b00-e90bb85ec740';

  var form = document.getElementById('contactForm');
  var btn = document.getElementById('sendBtn');
  var statusEl = document.getElementById('status');

  function setStatus(msg, type) {
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (type ? ' ' + type : '');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('name').value.trim();
    var email = document.getElementById('email').value.trim();
    var message = document.getElementById('message').value.trim();

    if (message.length < 5) { setStatus('Lütfen mesajınızı yazın.', 'error'); return; }

    var payload = { access_key: ACCESS_KEY, subject: 'Teklifio iletişim formu', from_name: 'Teklifio', message: message };
    if (name) payload.name = name;
    if (email) payload.email = email;
    if (document.getElementById('botcheck').checked) payload.botcheck = true;

    btn.disabled = true;
    setStatus('Gönderiliyor…');

    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.success) {
          form.reset();
          setStatus('Mesajınız iletildi, teşekkürler.', 'ok');
        } else {
          setStatus('Mesaj gönderilemedi, lütfen biraz sonra tekrar deneyin.', 'error');
        }
      })
      .catch(function () {
        setStatus('Mesaj gönderilemedi, internet bağlantınızı kontrol edip tekrar deneyin.', 'error');
      })
      .then(function () { btn.disabled = false; });
  });
})();
</script>
</body>
</html>
